<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#333333">
    <!--
      The app's own font stack is system fonts (see tailwind.config.ts). Ten
      Google Fonts families used to be fetched here; exactly one of them,
      Outfit, is actually referenced, by a single marketing heading. The rest
      were two third-party connections and ten font downloads on every load,
      including the portal — and in Community mode on a LAN with no internet,
      a guaranteed stall for nothing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"></noscript>
    <title>Homecast</title>

    <!--
      The icons below are generated from the one vector master — see brand/build.mjs.
      Until now index.html declared no favicon at all (browsers fell back to an
      implicit /favicon.ico fetch), no apple-touch-icon, and no og:image despite
      advertising summary_large_image, which rendered every share as a blank card.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="description" content="Give Android, Windows, and web users access to your Apple HomeKit smart home" />
    <meta name="author" content="Homecast" />

    <meta property="og:title" content="Homecast" />
    <meta property="og:description" content="Give Android, Windows, and web users access to your Apple HomeKit smart home" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://homecast.cloud/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://homecast.cloud/og-image.png" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3529699450676628" crossorigin="anonymous"></script>
    <!-- Google Analytics (Consent Mode v2) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied'
      });
      try {
        if (localStorage.getItem('cookie-consent') === 'granted') {
          gtag('consent', 'update', {
            'ad_storage': 'granted',
            'ad_user_data': 'granted',
            'ad_personalization': 'granted',
            'analytics_storage': 'granted'
          });
        }
      } catch(e) {}
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DC316TN5R0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DC316TN5R0');
    </script>
    <!--
      Boot watchdog. Inline, and deliberately not a module.

      The service worker serves navigations from its shell cache, and index.html
      is the one document with no content hash — so after a deploy it can name an
      entry script the deploy has deleted. That script then 404s, and because
      every other recovery we have (the ErrorBoundary, Vite's preloadError hook,
      reloadForNewBundle) lives *inside* that script, none of it is running. The
      page sits on the splash below forever with nothing alive to notice.

      This is the one piece of code that still runs in that state. It clears the
      caches the worker serves from, lets go of the worker, and reloads onto the
      real bundle — once per session, so a genuinely broken deploy cannot turn
      into a reload loop.
    -->
    <script>
      (function () {
        var KEY = 'homecast-boot-recovery';
        window.__hcRecover = function (reason) {
          if (window.__homecastBooted) return;
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, reason);
          } catch (e) { /* private mode: one attempt, no guard */ }

          var done = false;
          var go = function () { if (done) return; done = true; location.reload(); };
          // Reload even if storage never settles — being stuck on the splash is
          // the bug, so this must not be able to add another way to stay there.
          setTimeout(go, 2000);

          var jobs = [];
          try {
            if (window.caches) {
              jobs.push(caches.keys().then(function (names) {
                return Promise.all(names.filter(function (n) {
                  return n.indexOf('homecast-') === 0;
                }).map(function (n) { return caches.delete(n); }));
              }));
            }
          } catch (e) { /* no Cache API (insecure context) */ }
          try {
            if (navigator.serviceWorker) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }));
            }
          } catch (e) { /* no worker to release */ }

          Promise.all(jobs).then(go, go);
        };

        // Resource errors don't bubble, but they do reach a capture-phase
        // listener here — and this has to be a listener rather than an onerror
        // attribute on the script tag, because Vite rewrites that tag on build
        // and drops the attribute with it.
        //
        // Scoped hard to our own hashed assets. Every blocked third-party
        // script fires this same event — the ad blocker in the bug report was
        // cancelling googlesyndication — and recovering for one of those would
        // be a reload loop with no cause to fix.
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || !t.tagName) return; // a thrown error, not a failed resource
          var src = t.src || t.href;
          if (!src || src.indexOf(location.origin + '/assets/') !== 0) return;
          window.__hcRecover('asset');
        }, true);

        // Backstop for the case where the entry neither loads nor errors — a
        // request left hanging. Generous, because a slow phone on a big bundle
        // is not a fault, and skipped outright when the device says it has no
        // network: there the bundle is fine and the cache is the only reason
        // anything renders at all.
        setTimeout(function () {
          if (window.__homecastBooted) return;
          if (navigator.onLine === false) return;
          window.__hcRecover('timeout');
        }, 20000);
      })();
    </script>
  </head>

  <body style="margin:0">
    <div id="root"><div id="app-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:28px"><img src="/icon-192.png" alt="" width="80" height="80" style="border-radius:18px;display:block" /><div style="width:22px;height:22px;border:2px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.55);border-radius:50%;animation:hcSpin .7s linear infinite"></div><style>@keyframes hcSpin{to{transform:rotate(360deg)}}</style></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
