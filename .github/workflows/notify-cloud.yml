name: Notify Cloud Deploy
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Type check
        # The build is esbuild-only and does not type-check, so without this
        # step type errors never surface in CI or in a local build.
        run: npx tsc --noEmit
      - name: Unit and integration tests
        # --coverage enforces the thresholds in vitest.config.ts, so coverage
        # can only ratchet upward.
        run: npx vitest run --coverage
      - name: Build
        run: npm run build

  notify:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cloud staging deploy
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.PROMOTE_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/parob/homecast-cloud/dispatches \
            -d '{"event_type":"web-updated"}'
