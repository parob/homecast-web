name: Notify Cloud Deploy
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Type check (ratchet)
        # The build is esbuild-only and does not type-check. NOTE: a bare
        # `npx tsc --noEmit` here checked NOTHING for years — the root
        # tsconfig.json is solution-style ("files": []), so tsc had zero
        # inputs and exited green. The ratchet script runs the REAL check
        # (-p tsconfig.app.json) against a committed baseline: new type
        # errors fail the build, and the baseline can only shrink.
        run: npm run typecheck
      - name: Unit and integration tests
        # --coverage enforces the thresholds in vitest.config.ts, so coverage
        # can only ratchet upward.
        run: npx vitest run --coverage
      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            screenshots/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: screenshots
      - run: npx playwright install --with-deps chromium
        working-directory: screenshots
      - name: Browser regressions (desktop and phone)
        run: npx playwright test --config playwright.ci.config.ts
        working-directory: screenshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: screenshots/test-results/
          retention-days: 7

  notify:
    needs: [test, browser]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cloud staging deploy
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.PROMOTE_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/parob/homecast-cloud/dispatches \
            -d '{"event_type":"web-updated"}'
