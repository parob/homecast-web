<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 690" width="820" height="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The train light automation</title>
<desc id="d">A schedule fires every minute. An IF checks it is a weekday between 7 and 9am. An HTTP Request asks the TfL journey planner for trips to Blackfriars. A Code node turns minutes to spare into a colour and brightness. Four Set Device nodes turn the lamp on and apply hue, saturation and brightness.</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1067f4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1067f4"/></marker>
</defs>
<rect width="820" height="690" fill="#ffffff"/>
<rect x="90" y="20" width="640" height="100" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="410.0" y="62.8" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">Schedule</text>
<text x="410.0" y="100.5" text-anchor="middle" font-size="19" fill="#475569">every minute</text>
<rect x="90" y="160" width="640" height="100" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="410.0" y="202.8" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">IF</text>
<text x="410.0" y="240.5" text-anchor="middle" font-size="19" fill="#475569">a weekday, 7–9am?</text>
<line x1="410.0" y1="124" x2="410.0" y2="154" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="90" y="300" width="640" height="100" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="410.0" y="342.8" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">HTTP Request</text>
<text x="410.0" y="380.6" text-anchor="middle" font-size="19" fill="#475569">TfL journey planner</text>
<line x1="410.0" y1="264" x2="410.0" y2="294" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="90" y="440" width="640" height="100" rx="22" fill="url(#brand)" stroke="none" stroke-width="2"/>
<text x="410.0" y="482.8" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff">Code</text>
<text x="410.0" y="520.6" text-anchor="middle" font-size="19" fill="#dbeafe">minutes to spare → colour and brightness</text>
<line x1="410.0" y1="404" x2="410.0" y2="434" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="90" y="580" width="640" height="100" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="410.0" y="622.8" text-anchor="middle" font-size="26" font-weight="600" fill="#0f172a">Set Device × 4</text>
<text x="410.0" y="660.6" text-anchor="middle" font-size="19" fill="#475569">on · hue · saturation · brightness</text>
<line x1="410.0" y1="544" x2="410.0" y2="574" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
