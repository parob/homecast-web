<title id="t">Train light brightness as departure approaches</title>
<desc id="d">With a 7-minute walk: amber when you would wait more than 6 minutes on the platform, getting dimmer as the wait shrinks; green from 6 minutes down, getting brighter until full brightness at 2 minutes or less to spare.</desc>
