<title id="t">Train light brightness as departure approaches</title>
<desc id="d">Amber means wait. Green means walk normally (7 minutes). Purple means walk quickly (5 minutes). Both preserve at least 2 minutes on the platform. Below 7 minutes to departure, this train is skipped; red means no later journey is available in this example.</desc>
