<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Who gets access, and how</title>
<desc id="d">Your Apple Home connects through the Homecast relay. Household members get their own login and a role; guests get a share link with an optional passcode and time windows.</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1067f4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1067f4"/></marker>
</defs>
<rect width="820" height="560" fill="#ffffff"/>
<rect x="0" y="200" width="190" height="160" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="95.0" y="262.3" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Apple Home</text>
<text x="95.0" y="297.7" text-anchor="middle" font-size="17" fill="#475569">only your</text>
<text x="95.0" y="319.8" text-anchor="middle" font-size="17" fill="#475569">Apple ID</text>
<rect x="260" y="200" width="190" height="160" rx="22" fill="url(#brand)" stroke="none" stroke-width="2"/>
<text x="355.0" y="273.4" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">Homecast</text>
<text x="355.0" y="308.8" text-anchor="middle" font-size="17" fill="#dbeafe">your relay</text>
<line x1="194" y1="280" x2="254" y2="280" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="560" y="40" width="260" height="220" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="690.0" y="110.2" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Members</text>
<text x="690.0" y="145.6" text-anchor="middle" font-size="17" fill="#475569">the household</text>
<text x="690.0" y="167.7" text-anchor="middle" font-size="17" fill="#475569">own login · a role</text>
<text x="690.0" y="189.8" text-anchor="middle" font-size="17" fill="#475569">notifications</text>
<text x="690.0" y="211.9" text-anchor="middle" font-size="17" fill="#475569">Android · iPhone · web</text>
<rect x="560" y="300" width="260" height="220" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="690.0" y="370.2" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Guests</text>
<text x="690.0" y="405.6" text-anchor="middle" font-size="17" fill="#475569">everyone else</text>
<text x="690.0" y="427.7" text-anchor="middle" font-size="17" fill="#475569">a share link</text>
<text x="690.0" y="449.8" text-anchor="middle" font-size="17" fill="#475569">passcode · time windows</text>
<text x="690.0" y="471.9" text-anchor="middle" font-size="17" fill="#475569">no app, no account</text>
<line x1="454" y1="260" x2="552" y2="170" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="454" y1="300" x2="552" y2="400" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
