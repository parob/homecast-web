<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Two routes from Apple Home into Home Assistant</title>
<desc id="d">Apple Home connects to the Homecast relay. From there, the Homecast integration for Home Assistant connects over the web, or Homecast publishes to an MQTT broker that Home Assistant reads.</desc>
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1067f4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1067f4"/></marker>
</defs>
<rect width="820" height="470" fill="#ffffff"/>
<rect x="0" y="150" width="180" height="170" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="90.0" y="217.3" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Apple Home</text>
<text x="90.0" y="252.7" text-anchor="middle" font-size="17" fill="#475569">accessories</text>
<text x="90.0" y="274.8" text-anchor="middle" font-size="17" fill="#475569">stay here</text>
<rect x="230" y="150" width="180" height="170" rx="22" fill="url(#brand)" stroke="none" stroke-width="2"/>
<text x="320.0" y="228.4" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">Homecast</text>
<text x="320.0" y="263.8" text-anchor="middle" font-size="17" fill="#dbeafe">your relay</text>
<line x1="184" y1="235" x2="224" y2="235" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="470" y="20" width="170" height="160" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="555.0" y="82.9" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">Integration</text>
<text x="555.0" y="116.1" text-anchor="middle" font-size="16" fill="#475569">HACS · sign in</text>
<text x="555.0" y="136.9" text-anchor="middle" font-size="16" fill="#475569">push updates</text>
<rect x="470" y="290" width="170" height="160" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="555.0" y="352.9" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">MQTT broker</text>
<text x="555.0" y="386.1" text-anchor="middle" font-size="16" fill="#475569">Zigbee2MQTT-</text>
<text x="555.0" y="406.9" text-anchor="middle" font-size="16" fill="#475569">style topics</text>
<rect x="690" y="150" width="130" height="170" rx="22" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="755.0" y="229.0" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Home</text>
<text x="755.0" y="257.8" text-anchor="middle" font-size="24" font-weight="600" fill="#0f172a">Assistant</text>
<line x1="414" y1="210" x2="462" y2="110" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="414" y1="260" x2="462" y2="360" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="644" y1="100" x2="684" y2="200" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="644" y1="370" x2="684" y2="270" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
