<!doctype html>
<meta charset="utf-8">
<title>store frame</title>
<style>
  :root { --w: 1284px; --h: 2778px; --accent: #3b82f6; --accent2: #0ea5e9; }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 80% at 15% 0%, color-mix(in srgb, var(--accent) 55%, transparent) 0%, transparent 60%),
      radial-gradient(90% 70% at 100% 100%, color-mix(in srgb, var(--accent2) 45%, transparent) 0%, transparent 60%),
      linear-gradient(160deg, #0b1220 0%, #101a33 55%, #0b1220 100%);
    position: relative;
  }
  .copy { position: absolute; left: 7%; right: 7%; top: 6%; text-align: center; }
  .copy h1 { margin: 0 0 0.22em; font-weight: 800; letter-spacing: -0.025em; line-height: 1.02; font-size: var(--h1, 104px); text-wrap: balance; }
  .copy p { margin: 0; font-weight: 500; font-size: var(--p, 44px); line-height: 1.3; color: rgba(255,255,255,0.78); text-wrap: balance; }
  .device { position: absolute; left: 50%; transform: translateX(-50%); top: var(--device-top, 24%); width: var(--device-w, 86%);
            background: #0a0a0a; border-radius: var(--radius, 116px); padding: var(--bezel, 22px);
            box-shadow: 0 60px 140px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.10) inset, 0 0 0 1px rgba(0,0,0,0.6); }
  .device img { display: block; width: 100%; height: auto; border-radius: calc(var(--radius, 116px) - var(--bezel, 22px)); }
  /* Landscape (Mac): copy left-aligned, window frame lower, cropped at the bottom edge. */
  body.landscape .copy { left: 6%; right: auto; top: 7%; text-align: left; max-width: 62%; }
  body.landscape .device { top: var(--device-top, 30%); width: var(--device-w, 88%); left: 50%;
            border-radius: 28px; padding: 0; background: transparent;
            box-shadow: 0 50px 120px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.14); }
  body.landscape .device img { border-radius: 28px; }
  body.dark-copy { color: #0b1220; }
  body.dark-copy .copy p { color: rgba(11,18,32,0.7); }
</style>
<body>
  <div class="copy"><h1 id="h1"></h1><p id="p"></p></div>
  <div class="device"><img id="shot" alt=""></div>
  <script>
    const q = new URLSearchParams(location.search);
    const r = document.documentElement;
    for (const k of ['w','h','h1','p','device-top','device-w','radius','bezel']) if (q.get(k)) r.style.setProperty('--' + k, q.get(k));
    if (q.get('accent')) r.style.setProperty('--accent', q.get('accent'));
    if (q.get('accent2')) r.style.setProperty('--accent2', q.get('accent2'));
    if (q.get('landscape') === '1') document.body.classList.add('landscape');
    document.getElementById('h1').textContent = q.get('title') || '';
    document.getElementById('p').textContent = q.get('sub') || '';
    document.getElementById('shot').src = q.get('img');
  </script>
</body>
