<!doctype html>
<meta charset="utf-8">
<title>store frame</title>
<style>
  :root { --w: 1284px; --h: 2778px; --brand: #2563eb; --ink: #0b1220; --bg: #ffffff; --bg2: #eef3ff; --sub: rgba(11,18,32,0.62); }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased; position: relative;
    background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 48%);
  }
  body.dark { --ink: #ffffff; --bg: #0b1220; --bg2: #141d33; --sub: rgba(255,255,255,0.66); }
  .copy { position: absolute; left: 7%; right: 7%; top: 6.5%; }
  .copy h1 { margin: 0; font-weight: 800; letter-spacing: -0.035em; line-height: 0.98; font-size: var(--h1, 132px); text-wrap: balance; }
  .copy h1 em { font-style: normal; color: var(--brand); }
  .copy p { margin: 0.45em 0 0; font-weight: 500; font-size: var(--p, 42px); line-height: 1.25; color: var(--sub); max-width: 92%; }
  .device { position: absolute; left: 50%; top: var(--device-top, 27%); width: var(--device-w, 96%);
            transform: translateX(calc(-50% + var(--shift-x, 0px))) rotate(var(--tilt, 0deg)); transform-origin: 50% 20%;
            background: #0d0d0f; border-radius: var(--radius, 132px); padding: var(--bezel, 24px);
            box-shadow: 0 70px 160px rgba(11,18,32,0.35), 0 0 0 2px rgba(255,255,255,0.08) inset; }
  .device img { display: block; width: 100%; height: auto; border-radius: calc(var(--radius, 132px) - var(--bezel, 24px)); }
  .device .island { position: absolute; left: 50%; top: calc(var(--bezel, 24px) + 22px); transform: translateX(-50%); width: 25%; height: 3.2%; max-height: 92px; background: #000; border-radius: 999px; }
  body.no-island .device .island { display: none; }
  /* Mac: a window with its title-bar lights, headline left, window big and low. */
  body.landscape .copy { left: 6%; right: auto; top: 8%; max-width: 58%; }
  body.landscape .device { top: var(--device-top, 30%); width: var(--device-w, 92%); border-radius: 26px; padding: 0; background: #1c1c1e;
            box-shadow: 0 60px 140px rgba(11,18,32,0.30), 0 0 0 1px rgba(0,0,0,0.25); overflow: hidden; }
  body.landscape .device .bar { height: 52px; background: linear-gradient(#3a3a3c, #2c2c2e); display: flex; align-items: center; gap: 14px; padding-left: 22px; }
  body.landscape .device .bar i { width: 18px; height: 18px; border-radius: 50%; display: block; }
  body.landscape .device .bar i:nth-child(1) { background: #ff5f57; } body.landscape .device .bar i:nth-child(2) { background: #febc2e; } body.landscape .device .bar i:nth-child(3) { background: #28c840; }
  body.landscape .device img { border-radius: 0; }
  body.landscape .device .island { display: none; }
</style>
<body>
  <div class="copy"><h1 id="h1"></h1><p id="p"></p></div>
  <div class="device"><div class="bar" id="bar" hidden><i></i><i></i><i></i></div><img id="shot" alt=""><div class="island"></div></div>
  <script>
    const q = new URLSearchParams(location.search);
    const r = document.documentElement;
    for (const k of ['w','h','h1','p','device-top','device-w','radius','bezel','tilt','shift-x']) if (q.get(k)) r.style.setProperty('--' + k, q.get(k));
    if (q.get('theme') === 'dark') document.body.classList.add('dark');
    if (q.get('landscape') === '1') { document.body.classList.add('landscape'); document.getElementById('bar').hidden = false; }
    if (q.get('island') === '0') document.body.classList.add('no-island');
    // *phrase* in the title is drawn in the brand colour.
    const h1 = document.getElementById('h1');
    (q.get('title') || '').split(/(\*[^*]+\*)/).forEach((part) => {
      if (!part) return;
      if (part.startsWith('*')) { const em = document.createElement('em'); em.textContent = part.slice(1, -1); h1.appendChild(em); }
      else h1.appendChild(document.createTextNode(part));
    });
    document.getElementById('p').textContent = q.get('sub') || '';
    document.getElementById('shot').src = q.get('img');
  </script>
</body>
