<!doctype html>
<meta charset="utf-8"><title>sheet scroll</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font:13px -apple-system,system-ui,sans-serif;background:#111;color:#fff;padding:12px}
  .phone{position:relative;width:300px;height:260px;overflow:hidden;display:inline-block;
    margin-right:14px;border:1px solid #444;border-radius:12px;background:#1b2536}
  .cap{position:absolute;top:4px;right:6px;z-index:5;font-size:10px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:5px}
  /* SheetContent side=left: inset-y-0 h-full, a plain block */
  .sheet{position:absolute;inset:0 auto 0 0;height:100%;width:200px;background:#222;padding:0}
  /* AdminSidebar root */
  .side{width:200px;display:flex;flex-direction:column;min-height:0;background:#252d3d}
  .fixed .side{height:100%}
  .head{padding:10px;border-bottom:1px solid #3a4658}
  .nav{flex:1;padding:8px;overflow-y:auto}
  .nav div{padding:7px 8px;border-radius:6px;background:#2f3a4d;margin-bottom:4px;font-size:12px}
  pre{color:#9ae6b4;font:11px ui-monospace,Menlo,monospace}
</style>
<div class="phone broken"><span class="cap">no h-full</span><div class="sheet"><div class="side">
  <div class="head">Admin Panel</div><div class="nav" id="a"></div></div></div></div>
<div class="phone fixed"><span class="cap">h-full</span><div class="sheet"><div class="side">
  <div class="head">Admin Panel</div><div class="nav" id="b"></div></div></div></div>
<pre id="out"></pre>
<script>
const items = n => Array.from({length:18},(_,i)=>`<div>Nav item ${i+1}</div>`).join('');
a.innerHTML = items(); b.innerHTML = items();
addEventListener('load',()=>{
  const rows=[];
  document.querySelectorAll('.phone').forEach(p=>{
    const nav=p.querySelector('.nav');
    rows.push(`${p.classList.contains('fixed')?'h-full  ':'no h-full'}  scrollable: ${nav.scrollHeight > nav.clientHeight + 1 ? 'YES' : 'no'}  (client ${nav.clientHeight}, content ${nav.scrollHeight})`);
  });
  out.textContent = rows.join('\n');
});
</script>
